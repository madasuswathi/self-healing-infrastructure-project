global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "nimbustrace-dashboard"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "dashboard:4300"

  - job_name: "monitored-node-app"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "monitored-app:4304"
