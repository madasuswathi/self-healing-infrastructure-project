
global:

  scrape_interval: 10s

  evaluation_interval: 10s


rule_files:

  - /etc/prometheus/alerts.yml


scrape_configs:

  # Dashboard backend

  - job_name: "nimbustrace-dashboard"

    metrics_path: /metrics

    static_configs:

      - targets:
          - "dashboard:4300"


  # Monitored Node.js application

  - job_name: "monitored-node-app"

    metrics_path: /metrics

    static_configs:

      - targets:
          - "monitored-app:4304"

