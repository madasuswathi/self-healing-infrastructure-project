global:
  resolve_timeout: 5m

route:
  receiver: nimbustrace-webhook
  group_by:
    - alertname
    - severity
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 2h

receivers:
  - name: nimbustrace-webhook
    webhook_configs:
      - url: "http://host.docker.internal:4305/webhook"
        send_resolved: false
